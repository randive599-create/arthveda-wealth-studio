<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ArthVeda Private Office — Wealth Projection Studio. Visualize every stage of your financial journey in one institutional-grade projection studio.">
  <!-- Canvas -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Emerald left accent rail -->
  <rect x="0" y="0" width="10" height="630" fill="#064E3B"/>

  <!-- Outer hairline frame -->
  <rect x="40.5" y="40.5" width="1119" height="549" fill="none" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Brand monogram -->
  <g transform="translate(96,96)">
    <rect width="56" height="56" rx="8" fill="#064E3B"/>
    <path d="M28 11 L44 45 H36.5 L28 27 L19.5 45 H12 Z" fill="#FFFFFF"/>
    <rect x="23.4" y="34" width="9.2" height="3.8" fill="#10B981"/>
  </g>

  <!-- Wordmark -->
  <text x="172" y="140" font-family="Cormorant Garamond, Georgia, serif" font-size="62" font-weight="700" letter-spacing="-0.5" fill="#111827">ArthVeda</text>

  <!-- Division divider -->
  <line x1="96" y1="196" x2="128" y2="196" stroke="#E5E7EB" stroke-width="1"/>
  <text x="140" y="201" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600" letter-spacing="6" fill="#064E3B">PRIVATE OFFICE</text>

  <!-- Product title -->
  <text x="96" y="300" font-family="Cormorant Garamond, Georgia, serif" font-size="74" font-weight="700" font-style="italic" fill="#111827">Wealth Projection Studio</text>

  <!-- Tagline (two lines, manually balanced) -->
  <text x="96" y="372" font-family="Work Sans, system-ui, sans-serif" font-size="27" font-weight="400" fill="#4B5563">Visualize every stage of your financial journey — accumulation,</text>
  <text x="96" y="410" font-family="Work Sans, system-ui, sans-serif" font-size="27" font-weight="400" fill="#4B5563">growth, preservation, and income — in one institutional-grade studio.</text>

  <!-- Footer hairline -->
  <line x1="96" y1="486" x2="1104" y2="486" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Footer row: audience tags (left) -->
  <text x="96" y="528" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" letter-spacing="1.5" fill="#111827">SIP &#183; LUMPSUM &#183; SWP &#183; RETIREMENT &#183; INFLATION</text>

  <!-- Footer row: trust line (right) -->
  <text x="1104" y="528" text-anchor="end" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="400" fill="#4B5563">Illustrative projections. Not investment advice.</text>

  <!-- Domain -->
  <text x="96" y="558" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" letter-spacing="0.5" fill="#064E3B">arthvedawealth.in</text>
</svg>
